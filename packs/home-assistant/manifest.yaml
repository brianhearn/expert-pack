name: "Home Assistant Smart Home Guide"
slug: "home-assistant"
type: "composite"
version: "2.0.0"
schema_version: "1.2"
description: "Complete guide to Home Assistant — combining deep platform reference knowledge with a practical, phased guide to building a reliable smart home. The product pack covers the platform's architecture, protocols, automation model, and troubleshooting. The process pack guides you through the full journey from hardware selection to a hardened, automated home."
entry_point: "overview.md"
author: "EasyBot / Brian Hearn"
created: "2026-03-10"
updated: "2026-08-17"

packs:
  - path: "product"
    role: knowledge
  - path: "process"
    role: knowledge

authority_boundary:
  in_scope: "Topics covered by the Home Assistant product and process packs in this composite."
  out_of_scope:
    - "Legal, medical, or financial advice"
    - "Other smart-home platforms not covered by the constituent packs"
    - "Licensed electrical or construction work"
  refuse_when:
    - "No supporting atom in either constituent pack"
    - "Question is outside in_scope"
  no_source_no_claim: false

conflicts:
  priority: [product, process]
  strategy: "fail_closed"
  isolation:
    voice_must_not_assert_knowledge: true
    knowledge_must_not_override_voice: true
    respect_access_tiers: true
  tie_break: [authority_boundary, confidence, verified_at]

context:
  overrides:
    "product":
      always:
        - overview.md
    "process":
      always:
        - overview.md
