questions:
  - id: q001
    category: concept
    question: "What is the difference between string and microinverters?"
    expected_answer: "A string inverter converts DC from a series string of panels to AC at a single centralized unit. Microinverters convert DC to AC at each panel (or small group), so shading or a single panel failure has less impact on the rest of the array. The tradeoff is typically higher equipment cost and more roof-level electronics for micros versus simpler, centralized service for string inverters (often with module-level power electronics when rapid-shutdown or per-module optimization is required)."
    expected_contains: ["string", "microinverter"]
    ek_dependent: false

