[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "expertpack-cli"
version = "0.2.0"
description = "Unified CLI for authoring, validating, exporting, and migrating ExpertPacks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml"]

[project.optional-dependencies]
# Needed only for eval scoring (claim_verifier) and full JSON Schema checks.
eval = ["requests", "jsonschema"]

[project.scripts]
expertpack = "expertpack:main"

# Supports both editable (`pip install -e .`) and self-contained wheel (`pip install .`)
# installs; setup.py bundles tools/, template/, and schemas/registry/ into share/expertpack/.
[tool.setuptools]
py-modules = ["expertpack"]

[tool.setuptools.package-dir]
"" = "tools/cli"
