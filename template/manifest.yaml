# ExpertPack Manifest — Fill in all fields before hydrating

# ── Identity ──────────────────────────────────────────────────────────────────
name: "Your Pack Name"
slug: "your-pack-slug"           # kebab-case, no spaces

# Change type to match your subject:
#   product  — a software product, platform, or tool
#   person   — a human being (stories, beliefs, voice, relationships)
#   process  — a complex multi-phase endeavor
#   composite — combines multiple packs (advanced)
type: "product"

version: "1.0.0"
schema_version: "4.1"
description: "One paragraph describing what this pack covers and who it's for."
entry_point: "overview.md"

# ── Author ────────────────────────────────────────────────────────────────────
author: "Your Name"
created: "YYYY-MM-DD"
updated: "YYYY-MM-DD"

# ── Freshness tracking ────────────────────────────────────────────────────────
# Update after each review pass. coverage_pct = verified_file_count / total_file_count * 100
freshness:
  refresh_cycle: "P90D"          # How often content should be reviewed (ISO 8601)
  last_full_review: "YYYY-MM-DD"
  verified_file_count: 0
  total_file_count: 0
  coverage_pct: 0

# ── Product-specific fields (remove if type != product) ───────────────────────
product_version: "x.x"
vendor: "Vendor Name"
website: "https://example.com"
documentation: "https://docs.example.com"

# ── EK Ratio (fill in after running blind-probe eval) ─────────────────────────
# ek_ratio:
#   value: 0.00
#   measured: "YYYY-MM-DD"
#   models: ["gpt-5", "claude-sonnet-4-6", "gemini-2.5-flash"]
#   propositions_tested: 0

# ── Authority boundary ────────────────────────────────────────────────────────
# What this pack may assert. Consumers must refuse outside it.
authority_boundary:
  in_scope: "Replace with the subject matter this pack is allowed to assert."
  out_of_scope:
    - "Legal, medical, or financial advice"
    - "Products, people, or processes not covered by this pack"
  refuse_when:
    - "No supporting atom in the pack"
    - "Question is outside in_scope"
  no_source_no_claim: false

# ── Context strategy ──────────────────────────────────────────────────────────
# Controls how AI agents load this pack.
# Tier 1 (always): loaded every session
# Tier 2 (searchable): indexed for RAG retrieval
# Tier 3 (on_demand): loaded only on explicit request
context:
  always:
    - overview.md
    - glossary.md        # Optional; only if you maintain a lean cross-cutting glossary
  searchable:
    - concepts/
    - workflows/
    - troubleshooting/
    - faq/               # v4.1: cross-cutting FAQs only; per-concept FAQs live in concepts/
  on_demand:
    - volatile/
