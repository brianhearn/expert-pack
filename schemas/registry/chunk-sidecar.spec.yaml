# ExpertPack Chunk Metadata Sidecar
# Version: 1.0
# Date: 2026-07-06
#
# Descriptive spec for the `<name>.chunks.yaml` sidecar generated by
# tools/chunker/ep-chunk-annotate.py. See
# schemas/rfcs/RFC-004-chunk-metadata-sidecars.md. Markdown remains canonical;
# the sidecar records semantic chunk boundaries beside the file so the indexer
# splits deterministically without embedding chunk metadata into the body.

schema: expertpack.chunk_sidecar.v1
version: "1.0"
file_naming: "<markdown-stem>.chunks.yaml, adjacent to the source .md"
generated_by: tools/chunker/ep-chunk-annotate.py

required:
  - schema_version
  - source_id
  - content_hash
  - chunks

fields:
  schema_version:
    type: string
    description: Sidecar format version (currently "1.0").

  source_id:
    type: string
    description: Frontmatter id of the source .md file.
    example: blender-3d/concepts/modeling-topology

  content_hash:
    type: string
    pattern: ^sha256:[a-f0-9]{64}$
    description: SHA-256 of the frontmatter-stripped body; must match the .md file (else W-CHUNK-02).

  generated_by:
    type: string
    description: Tool that produced the sidecar.

  chunks:
    type: array
    description: Ordered list of chunk records; chunk_order must be contiguous from 0.
    items:
      type: object
      required: [chunk_id, chunk_order, line_range]
      fields:
        chunk_id:
          type: string
          description: "{file-stem}--{section-slug} (opening for chunk 0). Unique within the sidecar."
        chunk_order:
          type: integer
          description: 0-based contiguous order used by the indexer to reassemble the logical unit.
        section:
          type: [string, "null"]
          description: Heading text for the chunk, or null for the opening/lead chunk.
        line_range:
          type: array
          items: integer
          description: "[start, end] 1-indexed inclusive lines in the source .md."
        tokenizer_tokens:
          type: integer
          description: Estimated token count for the chunk.
        embedding_version:
          type: string
          description: Embedding model/version the chunk was measured against (optional).
        chunk_summary:
          type: string
          description: One-line retrieval anchor for the chunk (optional).
        context_prefix:
          type: string
          description: >-
            Deterministic index-side situating string (title + section).
            Indexers prepend this before embed/BM25. Do not write it into
            the Markdown body. Generated by ep-chunk-annotate.

notes:
  - Sidecars are opt-in; only oversized atomic/reference files need one (W-CHUNK-01).
  - Standard oversized concepts should split into atoms (W-V41-01) rather than add a sidecar.
  - ep-chunk-annotate --check regenerates and diffs the sidecar for CI drift detection.
