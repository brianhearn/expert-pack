# ExpertPack schema compatibility index
# Generated/maintained as the single source for README schema tables.

expertpack_schema_family: "4.1"
updated: "2026-07-06"
schemas:
  core:
    file: schemas/core.md
    version: "4.1"
    description: "Shared principles: MD-canonical, atomic-conceptual model, `requires:`, provenance, Reconstruct Mode, chunk sidecars, TAC, `--strict` gate, graph export, registry projections"
  product:
    file: schemas/product.md
    version: "4.1"
    extends: core
    description: "Product packs: concepts, workflows, interfaces, troubleshooting, commercial, customers"
  person:
    file: schemas/person.md
    version: "4.1"
    extends: core
    description: "Person packs: stories, reflections, opinions, conversations, mind taxonomy, relationships, presentation"
  agent:
    file: schemas/agent.md
    version: "1.7"
    subtype_of: person
    description: "Agent extension: persona, capabilities, tool access, behavioral rules"
  process:
    file: schemas/process.md
    version: "4.1"
    extends: core
    description: "Process packs: phases, decisions, checklists, exceptions, scheduling, regulations"
  composite:
    file: schemas/composite.md
    version: "1.1"
    extends: core
    description: "Composites: multi-pack deployment, role assignments, auto-discovery & export"
  eval:
    file: schemas/eval.md
    version: "1.3"
    description: "Evaluation: EK ratio, correctness, hallucination, retrieval quality, structural health, TAC scoring"
  registry_agent_knowledge:
    file: schemas/registry/agent-knowledge.spec.yaml
    version: "1.0"
    description: "Compact Agent Knowledge Schema (AKS) JSONL — includes optional fragment provenance fields"
  registry_frontmatter:
    file: schemas/registry/frontmatter.spec.yaml
    version: "1.0"
    description: "Content-file frontmatter contract enforced by `ep-validate --strict` (companion JSON Schema)"
  registry_chunk_sidecar:
    file: schemas/registry/chunk-sidecar.spec.yaml
    version: "1.0"
    description: "Chunk metadata sidecar format for oversized atomic/reference files (RFC-004)"
  registry_typed_answer:
    file: schemas/registry/typed-answer.spec.yaml
    version: "1.0"
    description: "Typed Answer Contract v1 — machine-verifiable claim-to-source agent responses"
  registry_ontology:
    file: schemas/registry/ontology.spec.yaml
    version: "1.0"
    description: "Accepted ontology registry descriptive spec for graph/entity interop"
